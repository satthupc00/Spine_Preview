<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363A43"/>
      <stop offset="1" stop-color="#1B1D22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#E5383B" stop-opacity=".30"/>
      <stop offset="1" stop-color="#E5383B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D3C7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5D"/>
      <stop offset="1" stop-color="#C92528"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="sq"><rect x="24" y="24" width="464" height="464" rx="104"/></clipPath>
  </defs>

  <!-- squircle background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
    <!-- faint viewport frame corners -->
    <g fill="none" stroke="#8A9AB0" stroke-opacity=".35" stroke-width="10" stroke-linecap="round">
      <path d="M92 150 V96 H146"/><path d="M366 96 H420 V150"/>
      <path d="M92 362 V416 H146"/><path d="M420 362 V416 H366"/>
    </g>
  </g>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>

  <!-- Spine-style bone chain (root at bottom-left, bending up-right) -->
  <g filter="url(#shadow)">
    <!-- bone 1 -->
    <g transform="translate(150 360) rotate(-58)">
      <path d="M0 -30 L168 0 L0 30 Z" fill="url(#bone)"/>
      <circle r="34" fill="url(#bone)"/>
      <circle r="13" fill="#1F2126"/>
    </g>
    <!-- bone 2 -->
    <g transform="translate(239 217) rotate(-4)">
      <path d="M0 -26 L150 0 L0 26 Z" fill="url(#bone)"/>
      <circle r="29" fill="url(#bone)"/>
      <circle r="11" fill="#1F2126"/>
    </g>
  </g>

  <!-- red play badge -->
  <g filter="url(#shadow)">
    <circle cx="352" cy="352" r="86" fill="url(#red)"/>
    <circle cx="352" cy="352" r="86" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="4"/>
    <path d="M330 306 L398 352 L330 398 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
